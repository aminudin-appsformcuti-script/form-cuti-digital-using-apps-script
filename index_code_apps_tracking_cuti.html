<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
      body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
      .search-card { border-radius: 15px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
      .card-req { border-left: 5px solid #0d6efd; border-radius: 10px; }
    </style>
  </head>
  <body>
    <div class="container py-5" style="max-width: 700px;">
      
      <!-- Card Pencarian -->
      <div class="card search-card p-4 mb-4">
        <h4 class="text-center fw-bold text-primary mb-3">
          <i class="bi bi-search me-2"></i>Tracking Status Cuti
        </h4>
        <p class="text-center text-muted small mb-4">Masukkan Ops ID / ID SPX Anda untuk melacak status tanda tangan pengajuan cuti.</p>
        
        <form onsubmit="handleSearch(event)">
          <div class="input-group input-group-lg mb-3">
            <span class="input-group-text bg-white"><i class="bi bi-person-badge"></i></span>
            <input type="text" id="spxIdInput" class="form-control" placeholder="Contoh: Ops363910 / SPX14774" required>
            <button class="btn btn-primary px-4" type="submit" id="btnSearch">Cek Status</button>
          </div>
        </form>
      </div>

      <!-- Loading State -->
      <div id="loading" class="text-center my-4 d-none">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Mencari data pengajuan...</p>
      </div>

      <!-- Alert Box Error/Empty -->
      <div id="alertBox"></div>

      <!-- Container Hasil Pencarian -->
      <div id="resultContainer"></div>

    </div>

    <script>
      function handleSearch(e) {
        e.preventDefault();
        const spxId = document.getElementById('spxIdInput').value;
        const btnSearch = document.getElementById('btnSearch');
        const loading = document.getElementById('loading');
        const alertBox = document.getElementById('alertBox');
        const resultContainer = document.getElementById('resultContainer');

        alertBox.innerHTML = '';
        resultContainer.innerHTML = '';
        loading.classList.remove('d-none');
        btnSearch.disabled = true;

        google.script.run
          .withSuccessHandler(renderResults)
          .withFailureHandler(handleError)
          .trackCutiBySpxId(spxId);
      }

      function renderResults(response) {
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('btnSearch').disabled = false;

        const alertBox = document.getElementById('alertBox');
        const resultContainer = document.getElementById('resultContainer');

        if (!response) {
          alertBox.innerHTML = `<div class="alert alert-danger text-center">Tidak ada respon dari server.</div>`;
          return;
        }

        if (response.status === 'empty' || response.status === 'error') {
          alertBox.innerHTML = `<div class="alert alert-warning text-center">${response.message}</div>`;
          return;
        }

        let html = `<h6 class="mb-3 text-muted">Ditemukan ${response.data.length} pengajuan:</h6>`;

        response.data.forEach(item => {
          let pdfButtonHtml = '';
          if (item.canDownloadPdf) {
            pdfButtonHtml = `
              <div class="mt-3 text-end">
                <button class="btn btn-success fw-bold px-3 py-2" onclick="downloadPdf('${item.reqId}', this)">
                  <i class="bi bi-file-earmark-pdf-fill me-1"></i> Download PDF
                </button>
              </div>
            `;
          } else {
            pdfButtonHtml = `
              <div class="mt-3 text-end">
                <span class="badge bg-light text-muted border py-2 px-3">
                  <i class="bi bi-lock-fill me-1"></i> PDF dapat diunduh jika TTD lengkap
                </span>
              </div>
            `;
          }

          html += `
            <div class="card card-req shadow-sm mb-3 p-3 bg-white">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold text-dark fs-6">${item.reqId}</span>
                <span class="badge ${getStatusBadgeClass(item.status)}">${item.status}</span>
              </div>
              
              <div class="small text-secondary mb-2">
                <div><i class="bi bi-person me-1"></i> <strong>${item.nama}</strong></div>
                <div><i class="bi bi-calendar-event me-1"></i> ${item.tglMulai} s/d ${item.tglSelesai}</div>
                <div><i class="bi bi-chat-left-text me-1"></i> <em>"${item.alasan}"</em></div>
              </div>

              <!-- Tombol Download PDF Langsung -->
              ${pdfButtonHtml}
            </div>
          `;
        });

        resultContainer.innerHTML = html;
      }

      function getStatusBadgeClass(status) {
        let st = (status || '').toLowerCase();
        if (st.includes('reject')) return 'bg-danger';
        if (st.includes('approve') || st === 'done') return 'bg-success';
        return 'bg-warning text-dark';
      }

      function downloadPdf(reqId, btnElement) {
        const originalText = btnElement.innerHTML;
        btnElement.disabled = true;
        btnElement.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span> Membuka PDF...';

        google.script.run
          .withSuccessHandler(function(response) {
            btnElement.disabled = false;
            btnElement.innerHTML = originalText;

            if (response.status === 'success') {
              let pdfVal = response.pdfUrl;

              if (!pdfVal) {
                alert('File PDF tidak ditemukan di sistem.');
                return;
              }

              // 1. Jika berupa Link URL (Google Drive / Website)
              if (pdfVal.startsWith('http://') || pdfVal.startsWith('https://')) {
                window.open(pdfVal, '_blank');
                return;
              }

              // 2. Jika berupa Data Base64
              try {
                if (!pdfVal.startsWith('data:')) {
                  pdfVal = 'data:application/pdf;base64,' + pdfVal;
                }

                const a = document.createElement('a');
                a.href = pdfVal;
                a.download = 'Surat_Cuti_' + reqId + '.pdf';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
              } catch (err) {
                alert('Gagal mendownload PDF: ' + err.toString());
              }

            } else {
              alert('Gagal mengambil PDF: ' + response.message);
            }
          })
          .withFailureHandler(function(err) {
            btnElement.disabled = false;
            btnElement.innerHTML = originalText;
            alert('Error dari Server: ' + err.toString());
          })
          .generateCutiPdf(reqId);
      }

      function handleError(err) {
        document.getElementById('loading').classList.add('d-none');
        document.getElementById('btnSearch').disabled = false;
        document.getElementById('alertBox').innerHTML = `<div class="alert alert-danger text-center">Terjadi kesalahan sistem: ${err.toString()}</div>`;
      }
    </script>
  </body>
</html>
